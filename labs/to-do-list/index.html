<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List with Sub-Items</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <ul class="todo-list">
        <li>
            <input type="checkbox" id="task-1">
            <label for="task-1">Review Project Specs</label>
            <ul class="sub-item">
                <li><a href="https://google.com" class="sub-item-link" target="_blank">Documentation</a></li>
            </ul>
        </li>

        <li>
            <input type="checkbox" id="task-2">
            <label for="task-2">Design Assets</label>
            <ul class="sub-item">
                <li><a href="https://figma.com" class="sub-item-link" target="_blank">Style Guide</a></li>
            </ul>
        </li>

        <li>
            <input type="checkbox" id="task-3">
            <label for="task-3">Code Components</label>
            <ul class="sub-item">
                <li><a href="https://github.com" class="sub-item-link" target="_blank">Repository</a></li>
            </ul>
        </li>

        <li>
            <input type="checkbox" id="task-4">
            <label for="task-4">Deployment</label>
            <ul class="sub-item">
                <li><a href="https://vercel.com" class="sub-item-link" target="_blank">Hosting Panel</a></li>
            </ul>
        </li>
    </ul>

</body>
</html>
